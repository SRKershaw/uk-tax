[project]
name = "uk-tax"
version = "0.1.0"
description = "A pure UK personal tax engine — income, savings, dividend and capital gains tax, no web framework or database dependency."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uk_tax"]
